# /etc/after-office/tmux.conf: the agents' tmux server (after-office-agents.service)
# stays up with no sessions; no prefix key, so an attached browser terminal can't reach tmux commands
set -g exit-empty off
set -g prefix None
set -g prefix2 None
set -g status off
set -g history-limit 20000
set -g default-terminal "tmux-256color"
